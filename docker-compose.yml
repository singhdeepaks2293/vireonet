services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vireonet
      POSTGRES_PASSWORD: vireonet
      POSTGRES_DB: vireonet
    ports: ["5433:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vireonet"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: postgres12_pgx
      DB_PORT: "5432"
      POSTGRES_USER: vireonet
      POSTGRES_PWD: vireonet
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "namespace", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-ui:
    image: temporalio/ui:2.34.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8233:8080"]
    depends_on: [temporal]

  api:
    build: .
    environment:
      VIREONET_DATABASE_URL: postgresql+asyncpg://vireonet:vireonet@postgres:5432/vireonet
      VIREONET_TEMPORAL_ADDRESS: temporal:7233
      VIREONET_ADAPTER_MODE: fake
      VIREONET_LOG_LEVEL: INFO
      VIREONET_CORS_ORIGINS: ${VIREONET_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://10.228.197.24:5173}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_healthy }
    command: ["sh", "-c", "alembic upgrade head && uvicorn vireonet.main:app --host 0.0.0.0 --port 8000"]

  worker:
    build: .
    environment:
      VIREONET_DATABASE_URL: postgresql+asyncpg://vireonet:vireonet@postgres:5432/vireonet
      VIREONET_TEMPORAL_ADDRESS: temporal:7233
      VIREONET_ADAPTER_MODE: fake
      VIREONET_LOG_LEVEL: INFO
      VIREONET_FLOW_SCRIPT_RUNNER: ${VIREONET_FLOW_SCRIPT_RUNNER:-local}
      VIREONET_FLOW_SCRIPT_RUNNER_SECRET: ${VIREONET_FLOW_SCRIPT_RUNNER_SECRET:-change-me-runner-secret}
    networks: [default, scripts]
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_healthy }
    command: ["sh", "-c", "python -m vireonet.worker"]
    # NOTE: the worker does NOT run `alembic upgrade head`. The api and the
    # worker used to both run migrations at startup, and they raced: both
    # tried to CREATE TABLE device_config_versions at the same time and one
    # died with `duplicate key ... pg_type_typname_nsp_index`. Only the api
    # migrates; the worker just starts (it depends on postgres + temporal
    # being healthy, and the api having migrated by then).

  # Runs flow Python scripts away from the worker (VIREONET_FLOW_SCRIPT_RUNNER=sidecar):
  # no VireoNet secrets, read-only root filesystem, tmpfs /tmp, non-root,
  # internal network only, signed requests.
  script-runner:
    build: .
    user: "65534:65534"
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    environment:
      VIREONET_FLOW_SCRIPT_RUNNER_SECRET: ${VIREONET_FLOW_SCRIPT_RUNNER_SECRET:-change-me-runner-secret}
    networks: [scripts]
    command: ["python", "-m", "vireonet.flows.script_runner"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["5173:80"]
    depends_on: [api]

networks:
  default: {}
  # Worker <-> script-runner only; no route outside.
  scripts:
    internal: true

volumes:
  postgres-data:
