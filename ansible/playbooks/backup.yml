---
- name: Backup device config before a change
  hosts: all
  gather_facts: false
  vars:
    backup_dir: "/var/lib/awx/backups/{{ ticket | default('unknown') }}"
  tasks:
    - name: Ensure backup directory exists (controller)
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      run_once: true

    - name: Fetch running config (IOS)
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: running
      when: ansible_network_os == 'cisco.ios.ios'
      changed_when: false

    - name: Fetch running config (NX-OS)
      cisco.nxos.nxos_command:
        commands:
          - show running-config
      register: running
      when: ansible_network_os == 'cisco.nxos.nxos'
      changed_when: false

    - name: Save running config to controller
      ansible.builtin.copy:
        content: "{{ running.stdout[0] }}"
        dest: "{{ backup_dir }}/{{ inventory_hostname }}.cfg"
        mode: "0640"
      delegate_to: localhost
      changed_when: false

    # The BEGIN/END markers are the contract with services/backup.py:
    # extract_running_config() reads the config from exactly this span of
    # the job stdout. Do not rename them.
    - name: Print running config between backup markers
      ansible.builtin.debug:
        msg: "VIREONET-BACKUP-BEGIN\n{{ running.stdout[0] }}\nVIREONET-BACKUP-END"
      when: running.stdout is defined
      changed_when: false
