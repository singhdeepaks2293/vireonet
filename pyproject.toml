[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vireonet"
version = "0.1.0"
description = "Thin, network-aware change orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "structlog>=24.4",
    "temporalio>=1.9",
    "pyyaml>=6.0",
    "hvac>=2.3",
    "jinja2>=3.1",
    "prometheus-client>=0.20",
    "PyJWT>=2.8",
    "passlib[bcrypt]>=1.7.4",
    "ciscoconfparse>=1.9",
    "asyncssh>=2.14",  # Containerlab adapter drives the CLI over SSH (E4)
    "numpy>=1.26",  # ML tab
    "scikit-learn>=1.5",  # ML tab: anomaly, clustering, classification, regression
    "openpyxl>=3.1",  # Excel config push (config / backup tabs)
    "textfsm>=1.1",  # parse show logging (and other show output) into fields
    "ntc-templates>=5",  # ~1000 community TextFSM templates (Apache-2.0)
    "croniter>=6",  # flow schedule triggers: cron validation (MIT)
    "cryptography>=42",  # adapter secrets saved from the UI (Fernet; Apache-2.0/BSD)
]

[project.optional-dependencies]
# Optional Kafka trigger source for flows (Apache-2.0).
kafka = ["aiokafka>=0.11"]
dev = [
    "aiokafka>=0.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "pybatfish>=2024.1",  # Batfish adapter + tests (lazy import in the adapter)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 is a FastAPI false positive: Depends()/Query()/require_role() in
# argument defaults is the framework's documented dependency-injection
# pattern, not a mutable-default bug.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
